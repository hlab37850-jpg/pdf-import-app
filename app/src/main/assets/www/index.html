<!DOCTYPE html>
<html dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Import</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 20px; }
        button { padding: 12px; margin: 5px; width: 100%; font-size: 16px; }
        #output { white-space: pre-wrap; font-size: 14px; }
        .progress { width: 100%; height: 20px; }
    </style>
</head>
<body>
    <h1>PDF Import App</h1>
    <input type="file" id="fileInput" accept=".pdf" style="display:none">
    <button onclick="document.getElementById('fileInput').click()">Select PDF</button>
    <div id="status">No file selected</div>
    <div class="progress" id="progressBar" style="display:none">
        <div id="progressFill" style="width:0%;height:100%;background:#4CAF50"></div>
    </div>
    <h2>Results:</h2>
    <div id="output"></div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        
        let selectedFile = null;
        
        document.getElementById('fileInput').addEventListener('change', function(e) {
            selectedFile = e.target.files[0];
            document.getElementById('status').textContent = 'Selected: ' + selectedFile.name;
        });
        
        async function processPDF() {
            if (!selectedFile) return;
            
            const progressBar = document.getElementById('progressBar');
            const progressFill = document.getElementById('progressFill');
            progressBar.style.display = 'block';
            
            try {
                const arrayBuffer = await selectedFile.arrayBuffer();
                const pdf = await pdfjsLib.getDocument({data: arrayBuffer}).promise;
                
                let fullText = '';
                let tables = 0;
                let images = 0;
                
                for (let i = 1; i <= pdf.numPages; i++) {
                    progressFill.style.width = (i / pdf.numPages * 100) + '%';
                    
                    const page = await pdf.getPage(i);
                    const textContent = await page.getTextContent();
                    
                    // استخراج النص مع الحفاظ على التنسيق
                    let pageText = '';
                    textContent.items.forEach(item => {
                        pageText += item.str + ' ';
                    });
                    
                    fullText += '--- Page ' + i + ' ---\n' + pageText + '\n\n';
                    
                    // كشف الصور
                    const ops = await page.getOperatorList();
                    ops.fnArray.forEach(fn => {
                        if (fn === pdfjsLib.OPS.paintImageXObject) images++;
                    });
                }
                
                document.getElementById('output').textContent = fullText;
                document.getElementById('status').textContent = 
                    'Complete! Pages: ' + pdf.numPages + ', Images: ' + images;
                
            } catch (error) {
                document.getElementById('status').textContent = 'Error: ' + error.message;
            }
            
            progressBar.style.display = 'none';
        }
        
        // إضافة زر المعالجة
        document.addEventListener('DOMContentLoaded', function() {
            const processBtn = document.createElement('button');
            processBtn.textContent = 'Process PDF';
            processBtn.onclick = processPDF;
            document.querySelector('button').after(processBtn);
        });
    </script>
</body>
</html>
