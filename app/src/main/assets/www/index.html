<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PDF Import</title>
    <script src="js/pdf.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
        }
        .header {
            background: #6200EE;
            color: white;
            padding: 16px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .container {
            padding: 16px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            margin-bottom: 10px;
            -webkit-tap-highlight-color: transparent;
        }
        .btn:active { opacity: 0.8; }
        .btn-primary { background: #2196F3; color: white; }
        .btn-success { background: #4CAF50; color: white; }
        .btn:disabled { opacity: 0.5; }
        .status { padding: 12px; text-align: center; color: #666; font-size: 14px; }
        .progress-container { display: none; margin: 10px 0; }
        .progress-bar { width: 100%; height: 8px; background: #e0e0e0; border-radius: 4px; overflow: hidden; }
        .progress-fill { height: 100%; background: #4CAF50; width: 0%; transition: width 0.3s; }
        .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 10px 0; }
        .stat-card { background: #f8f9fa; border-radius: 8px; padding: 12px; text-align: center; }
        .stat-value { font-size: 24px; font-weight: bold; color: #6200EE; }
        .stat-label { font-size: 12px; color: #666; }
        .output {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 12px;
            font-size: 14px;
            white-space: pre-wrap;
            max-height: 400px;
            overflow-y: auto;
            word-wrap: break-word;
        }
        .rtl { direction: rtl; text-align: right; }
    </style>
</head>
<body>
    <div class="header">📄 PDF Import App</div>
    
    <div class="container">
        <div class="card">
            <input type="file" id="fileInput" accept=".pdf,application/pdf" style="display:none">
            <button class="btn btn-primary" id="selectBtn" type="button">📂 Select PDF File</button>
            <button class="btn btn-success" id="processBtn" type="button" disabled>🔄 Process PDF</button>
            <div class="status" id="status">No file selected</div>
            <div class="progress-container" id="progressContainer">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>
        </div>
        
        <div class="card" id="resultsCard" style="display:none">
            <h3>📊 Results</h3>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-value" id="pagesCount">0</div>
                    <div class="stat-label">Pages</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="confidence">0%</div>
                    <div class="stat-label">Confidence</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="imagesCount">0</div>
                    <div class="stat-label">Images</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="tablesCount">0</div>
                    <div class="stat-label">Tables</div>
                </div>
            </div>
            <h3>📝 Extracted Text</h3>
            <div class="output" id="output"></div>
        </div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'js/pdf.worker.min.js';
        
        let selectedFile = null;
        
        // زر اختيار الملف
        document.getElementById('selectBtn').addEventListener('click', function(e) {
            e.preventDefault();
            document.getElementById('fileInput').click();
        });
        
        // عند اختيار ملف
        document.getElementById('fileInput').addEventListener('change', function(e) {
            if (e.target.files && e.target.files.length > 0) {
                selectedFile = e.target.files[0];
                document.getElementById('status').textContent = '📄 Selected: ' + selectedFile.name;
                document.getElementById('status').style.color = '#4CAF50';
                document.getElementById('processBtn').disabled = false;
            }
        });
        
        // زر المعالجة
        document.getElementById('processBtn').addEventListener('click', function(e) {
            e.preventDefault();
            processPDF();
        });
        
        async function processPDF() {
            if (!selectedFile) {
                alert('Please select a PDF file first');
                return;
            }
            
            const processBtn = document.getElementById('processBtn');
            const selectBtn = document.getElementById('selectBtn');
            const progressContainer = document.getElementById('progressContainer');
            const progressFill = document.getElementById('progressFill');
            const status = document.getElementById('status');
            
            processBtn.disabled = true;
            selectBtn.disabled = true;
            progressContainer.style.display = 'block';
            status.textContent = '⏳ Processing...';
            status.style.color = '#2196F3';
            
            try {
                const arrayBuffer = await selectedFile.arrayBuffer();
                const pdf = await pdfjsLib.getDocument({data: arrayBuffer}).promise;
                
                let fullText = '';
                let imagesCount = 0;
                let tablesCount = 0;
                let isArabic = false;
                
                for (let i = 1; i <= pdf.numPages; i++) {
                    progressFill.style.width = (i / pdf.numPages * 100) + '%';
                    
                    const page = await pdf.getPage(i);
                    const textContent = await page.getTextContent();
                    let pageText = '';
                    
                    textContent.items.forEach((item) => {
                        if (item.str) {
                            pageText += item.str + ' ';
                        }
                    });
                    
                    if (!isArabic && /[\u0600-\u06FF]/.test(pageText)) {
                        isArabic = true;
                    }
                    
                    const ops = await page.getOperatorList();
                    ops.fnArray.forEach(fn => {
                        if (fn === pdfjsLib.OPS.paintImageXObject) imagesCount++;
                    });
                    
                    if (pageText.split('\n').length > 3) tablesCount++;
                    
                    fullText += '\n===== Page ' + i + ' =====\n' + pageText.trim() + '\n';
                }
                
                document.getElementById('pagesCount').textContent = pdf.numPages;
                document.getElementById('confidence').textContent = 
                    Math.min(95, 50 + (fullText.length > 1000 ? 20 : 0) + (imagesCount > 0 ? 10 : 0)) + '%';
                document.getElementById('imagesCount').textContent = imagesCount;
                document.getElementById('tablesCount').textContent = tablesCount;
                
                const output = document.getElementById('output');
                output.textContent = fullText;
                output.className = 'output ' + (isArabic ? 'rtl' : '');
                
                document.getElementById('resultsCard').style.display = 'block';
                status.textContent = '✅ Complete!';
                status.style.color = '#4CAF50';
                
            } catch (error) {
                status.textContent = '❌ Error: ' + error.message;
                status.style.color = '#F44336';
                console.error('Error:', error);
            }
            
            processBtn.disabled = false;
            selectBtn.disabled = false;
            progressContainer.style.display = 'none';
        }
        
        // بديل إذا لم يعمل file input
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'fileSelected') {
                // معالجة الملف من Android
                console.log('File from Android:', event.data);
            }
        });
    </script>
</body>
</html>
