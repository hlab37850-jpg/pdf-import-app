plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pdfimport.webview'
    compileSdk 34

    defaultConfig {
        applicationId "com.pdfimport.webview"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            storeFile file("../keystore/release.keystore")
            storePassword "pdfimport2024"
            keyAlias "pdfimport"
            keyPassword "pdfimport2024"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.8.0'
}
